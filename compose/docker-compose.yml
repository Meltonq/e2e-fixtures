# A small stack for the docker-compose split of the panel (APPLICATIONS_COMPOSE=true):
# web gets the domain, api is internal, db and cache become services of the pool.
services:
  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

  api:
    build: ./api
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgres://app:secret@db:5432/app
      REDIS_URL: redis://:secret@cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s

  cache:
    image: redis:7
    command: redis-server --requirepass secret

  mail:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  pgdata:
